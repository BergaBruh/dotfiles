config_version = 14

[bar]
order = [ "default" ]

    [bar.default]
    background_opacity = 0.83999999999999997
    capsule_padding = 4.0
    center = [ "media", "spacer_2", "clock", "spacer_2", "weather" ]
    contact_shadow = true
    end = [
        "bar_2",
        "widget_2",
        "notifications",
        "clipboard",
        "keyboard_layout",
        "network",
        "bluetooth",
        "volume",
        "brightness",
        "battery",
        "session"
    ]
    font_weight = 400
    margin_ends = 12
    radius = 40
    start = [ "keybinds", "widget", "bar", "tray" ]
    thickness = 32

[battery.device."/org/freedesktop/UPower/devices/headset_dev_40_72_18_C9_A5_D3"]
warning_threshold = 80

[brightness]
enable_ddcutil = true

[calendar]
enabled = true

[control_center.calendar]
show_events_card = false

[[control_center.shortcuts]]
type = "wifi"

[[control_center.shortcuts]]
type = "bluetooth"

[[control_center.shortcuts]]
type = "nightlight"

[[control_center.shortcuts]]
type = "wallpaper"

[[control_center.shortcuts]]
type = "power_profile"

[location]
address = "Orenburg"

[lockscreen]
wallpaper = "/home/bergamot/Wallpapers/Teto Reference.jpg"

[lockscreen_widgets]
enabled = true
schema_version = 2
widget_order = [ "lockscreen-login-box@winit", "lockscreen-login-box@eDP-1" ]

    [lockscreen_widgets.grid]
    cell_size = 16
    major_interval = 4
    visible = true

    [lockscreen_widgets.widget."lockscreen-login-box@eDP-1"]
    box_height = 196.0
    box_width = 810.0
    cx = 960.0
    cy = 1054.0
    output = "eDP-1"
    placement_height = 1200.0
    placement_width = 1920.0
    rotation = 0.0
    type = "login_box"

        [lockscreen_widgets.widget."lockscreen-login-box@eDP-1".settings]
        background_color = "surface_variant"
        background_opacity = 0.88
        background_radius = 12.0
        center_password_text = false
        input_opacity = 1.0
        input_radius = 6.0
        layout = "regular"
        show_caps_lock = true
        show_keyboard_layout = true
        show_login_button = true
        show_media = true
        show_session_buttons = true
        show_unlock_hint = true
        show_weather = true

    [lockscreen_widgets.widget."lockscreen-login-box@winit"]
    box_height = 196.0
    box_width = 810.0
    cx = 702.0
    cy = 1581.0
    output = "winit"
    placement_height = 0.0
    placement_width = 0.0
    rotation = 0.0
    type = "login_box"

        [lockscreen_widgets.widget."lockscreen-login-box@winit".settings]
        background_color = "surface_variant"
        background_opacity = 0.88
        background_radius = 12.0
        center_password_text = false
        input_opacity = 1.0
        input_radius = 6.0
        layout = "regular"
        show_caps_lock = true
        show_keyboard_layout = true
        show_login_button = true
        show_media = true
        show_session_buttons = true
        show_unlock_hint = true
        show_weather = true

[osd]
position = "top_left"

[plugin_settings."felipeartur/ai-usagebar"]
panel_open_near_click = true
refresh_minutes = 10

[plugin_settings."noctalia/mpvpaper"]
mpv_options = ""
video_directory = ""

[plugin_settings."noctalia/translator"]
target_lang = "ru"

[plugins]
auto_update = "all"
enabled = [
    "noctalia/translator",
    "noctalia/timer",
    "noctalia/kaomoji",
    "noctalia/mpvpaper",
    "felipeartur/ai-usagebar",
    "0lucasmatheus/awwwall",
    "oldirtty/color_picker",
    "umedbazarov/crashes",
    "mdj2812/mihomo-control",
    "fel/ocr",
    "decksters-lab/palette-creator",
    "noctalia/wallpaper_depth",
    "kenn/keybind-cheatsheet",
    "icefish/phone-connect",
    "salemsayed/codexbar-meter",
    "azokyen/spotify-media"
]

    [[plugins.source]]
    kind = "git"
    location = "https://github.com/noctalia-dev/official-plugins"
    name = "official"

    [[plugins.source]]
    kind = "git"
    location = "https://github.com/noctalia-dev/community-plugins"
    name = "community"

[shell]
font_family = "Noto Sans"
lang = "ru"
niri_overview_type_to_launch_enabled = true
password_style = "random"
polkit_agent = true
screen_time_enabled = true
settings_show_advanced = true

    [shell.panel]
    control_center_placement = "floating"
    launcher_session_search = true
    open_near_click_clipboard = true
    open_near_click_control_center = true
    open_near_click_launcher = true
    open_near_click_session = true
    open_near_click_wallpaper = true
    session_placement = "floating"
    transparency_mode = "soft"
    wallpaper_placement = "floating"

[theme]
builtin = "Noctalia"
community_palette = "Oxocarbon"
source = "wallpaper"
wallpaper_scheme = "m3-tonal-spot"

    [theme.templates]
    builtin_ids = [ "btop", "gtk3", "gtk4", "ghostty", "niri", "qt", "starship" ]
    community_ids = [
        "antigravity",
        "claude-code",
        "codex",
        "opencode",
        "spicetify",
        "zen-browser",
        "discord",
        "telegram",
        "blender",
        "libreoffice",
        "obsidian",
        "zed",
        "heroiclauncher",
        "prismlauncher",
        "steam",
        "obs",
        "lazygit"
    ]

[widget.bar]
type = "felipeartur/ai-usagebar:bar"

[widget.bar_2]
type = "icefish/phone-connect:bar"

[widget.clock]
anchor = true

[widget.keybinds]
type = "kenn/keybind-cheatsheet:keybinds"

[widget.network]
show_label = false

[widget.spacer_2]
type = "spacer"

[widget.weather]
show_condition = false

[widget.widget]
type = "oldirtty/color_picker:widget"

[widget.widget_2]
type = "mdj2812/mihomo-control:widget"